apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kube-state-metrics
  template:
    metadata:
      labels:
        app: kube-state-metrics
    spec:
      serviceAccountName: kube-state-metrics
      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.12.0
          ports:
            - name: http
              containerPort: 8080
          args:
            - --port=8080
            - --resources=pods,deployments,replicasets,statefulsets,daemonsets,services,endpoints,namespaces,configmaps,resourcequotas,limitranges,horizontalpodautoscalers,poddisruptionbudgets,ingresses,networkpolicies
