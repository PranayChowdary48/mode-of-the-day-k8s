apiVersion: v1
kind: ConfigMap
metadata:
  name: app-envoy-config
data:
  envoy.yaml: |
    static_resources:
      listeners:
        - name: app_http_listener
          address:
            socket_address:
              address: 0.0.0.0
              port_value: 8080
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: app_http
                    route_config:
                      name: app_route
                      virtual_hosts:
                        - name: app
                          domains: ["*"]
                          routes:
                            - match:
                                prefix: "/"
                              route:
                                cluster: app_cluster
                                timeout: 10s
                                retry_policy:
                                  retry_on: "5xx,connect-failure,refused-stream,reset,resource-exhausted,retriable-status-codes"
                                  retriable_status_codes: [429, 502, 503, 504]
                                  num_retries: 3
                                  per_try_timeout: 2s
                                  retry_back_off:
                                    base_interval: 0.25s
                                    max_interval: 2s
                    http_filters:
                      - name: envoy.filters.http.local_ratelimit
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
                          stat_prefix: local_rate_limit
                          token_bucket:
                            max_tokens: 20
                            tokens_per_fill: 20
                            fill_interval: 1s
                          filter_enabled:
                            runtime_key: local_rate_limit_enabled
                            default_value:
                              numerator: 100
                              denominator: HUNDRED
                          filter_enforced:
                            runtime_key: local_rate_limit_enforced
                            default_value:
                              numerator: 100
                              denominator: HUNDRED
                          response_headers_to_add:
                            - header:
                                key: x-envoy-local-ratelimited
                                value: "true"
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
        - name: redis_listener
          address:
            socket_address:
              address: 127.0.0.1
              port_value: 16379
          filter_chains:
            - filters:
                - name: envoy.filters.network.tcp_proxy
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
                    stat_prefix: redis_tcp
                    cluster: redis_cluster
      clusters:
        - name: app_cluster
          connect_timeout: 0.25s
          type: STATIC
          lb_policy: ROUND_ROBIN
          load_assignment:
            cluster_name: app_cluster
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: 127.0.0.1
                          port_value: 5000
        - name: redis_cluster
          connect_timeout: 0.25s
          type: STRICT_DNS
          lb_policy: ROUND_ROBIN
          load_assignment:
            cluster_name: redis_cluster
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: redis
                          port_value: 6379
          circuit_breakers:
            thresholds:
              - max_connections: 1000
                max_pending_requests: 1000
                max_requests: 1000
                max_retries: 3
          outlier_detection:
            consecutive_local_origin_failure: 3
            interval: 5s
            base_ejection_time: 30s
            max_ejection_percent: 50
    admin:
      access_log_path: /tmp/admin_access.log
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 9901
