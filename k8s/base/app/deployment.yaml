apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  labels:
    app: mood-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mood-app
  template:
    metadata:
      labels:
        app: mood-app
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "5000"
    spec:
      terminationGracePeriodSeconds: 20
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: app-sa
      priorityClassName: app-high
      containers:
        - name: app
          image: docker-app:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: REDIS_HOST
              value: 127.0.0.1
            - name: REDIS_PORT
              value: "16379"
            - name: REFRESH_USER
              valueFrom:
                secretKeyRef:
                  name: app-refresh-auth
                  key: username
            - name: REFRESH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-refresh-auth
                  key: password
          ports:
            - containerPort: 5000
              name: http
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 20
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
        - name: envoy
          image: envoyproxy/envoy:v1.30.4
          args: ["-c", "/etc/envoy/envoy.yaml"]
          ports:
            - containerPort: 8080
              name: envoy-http
            - containerPort: 9901
              name: envoy-admin
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: envoy-config
              mountPath: /etc/envoy
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
        - name: envoy-config
          configMap:
            name: app-envoy-config
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: mood-app
                topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: mood-app
