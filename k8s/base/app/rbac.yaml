apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: app-read
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints", "configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: app-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: app-read
subjects:
  - kind: ServiceAccount
    name: app-sa
